[project]
name = "rentalscout"
version = "0.1.0"
description = "Personal rental listing crawler, validation, and analysis toolkit."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
  "pydantic>=2.12.0",
  "scrapy>=2.16.0",
  "curl-cffi>=0.15.0",
  "pandas>=2.2.0",
  "streamlit>=1.45.0",
  "plotly>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rentalscout"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "RUF",
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"rentalscout/web/streamlit_app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
